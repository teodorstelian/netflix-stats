<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Viewing Visualizations</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
        }
        h1 {
            color: #ff4c4c;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Netflix Viewing Visualizations for {{ filename }}</h1>
        <div class="button-group">
            <a href="{{ url_for('stats', filename=filename) }}" class="btn btn-secondary">Back to Stats</a>
        </div>

        <h3>Visualizations</h3>
        <div>
            {{ visuals.total_watch_time_per_profile|safe }}
            {{ visuals.top_tv_shows|safe }}
            {{ visuals.top_movies|safe }}
            {{ visuals.top_devices|safe }}
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
